<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyVibe - Mon Sanctuaire</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h1 { color: #4f46e5; font-size: 24px; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; margin-bottom: 28px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4f46e5; }
        button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #4338ca; }
        #error-msg {
            color: #ef4444;
            margin-top: 14px;
            font-size: 14px;
            min-height: 20px;
        }
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #4f46e5;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .topbar h2 { font-size: 18px; }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.35); }
    </style>
</head>
<body>
    <div class="login-card" id="login-card">
        <h1>MyVibe - Mon Sanctuaire</h1>
        <p>Connectez-vous à votre espace personnel</p>
        <form id="login-form">
            <input type="text" id="username" placeholder="Nom d'utilisateur" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <div id="error-msg"></div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            if (data.success) {
                const welcomeMsg = data.role === 'admin'
                    ? 'Bienvenue Admin !'
                    : 'Bienvenue Ange Christelle !';
                const contentMsg = data.role === 'admin'
                    ? 'Panneau de gestion (en construction)'
                    : 'Dashboard (en construction)';

                document.body.innerHTML = `
                    <div class="topbar">
                        <h2>${welcomeMsg}</h2>
                        <button class="logout-btn" onclick="location.reload()">🔓 Se déconnecter</button>
                    </div>
                    <h2 style="margin-top:100px;color:#4f46e5;text-align:center;">${contentMsg}</h2>
                `;
                document.body.style.display = 'block';
                document.body.style.background = '#f3f4f6';
            } else {
                document.getElementById('error-msg').textContent = data.message;
            }
        });
    </script>
</body>
</html>
