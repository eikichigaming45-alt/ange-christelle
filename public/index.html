<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyVibe - Mon Sanctuaire</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h1 { color: #4f46e5; font-size: 24px; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; margin-bottom: 28px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4f46e5; }
        button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #4338ca; }
        #error-msg { color: #ef4444; margin-top: 14px; font-size: 14px; min-height: 20px; }

        /* Dashboard */
        .dashboard {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }
        .topbar {
            background: #4f46e5;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar h2 { font-size: 18px; }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4f46e5;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Page de connexion -->
    <div class="login-card" id="login-page">
        <h1>MyVibe - Mon Sanctuaire</h1>
        <p>Connectez-vous à votre espace personnel</p>
        <form id="login-form">
            <input type="text" id="username" placeholder="Nom d'utilisateur" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <div id="error-msg"></div>
    </div>

    <!-- Dashboard après connexion -->
    <div class="dashboard" id="dashboard-page">
        <div class="topbar">
            <h2 id="welcome-msg">Bienvenue !</h2>
            <button class="logout-btn" onclick="logout()">
                🔓 Se déconnecter
            </button>
        </div>
        <div class="content" id="dashboard-content">
            Dashboard en construction...
        </div>
    </div>

    <script>
        let currentUser = null;

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            if (data.success) {
                currentUser = { username, role: data.role };
                showDashboard();
            } else {
                document.getElementById('error-msg').textContent = data.message;
            }
        });

        function showDashboard() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dashboard-page').style.display = 'flex';
            document.body.style.background = '#f3f4f6';

            if (currentUser.role === 'admin') {
                document.getElementById('welcome-msg').textContent = 'Bienvenue Admin !';
                document.getElementById('dashboard-content').textContent = 'Panneau de gestion (en construction)';
            } else {
                document.getElementById('welcome-msg').textContent = 'Bienvenue Ange Christelle !';
                document.getElementById('dashboard-content').textContent = 'Votre dashboard arrive bientôt...';
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('dashboard-page').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('error-msg').textContent = '';
            document.body.style.background = '';
        }
    </script>

</body>
</html>
