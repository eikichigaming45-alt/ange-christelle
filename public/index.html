<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDaily</title>
    <link rel="icon" href="/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MyDaily">
    <meta name="theme-color" content="#7C3AED">
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Honeypot anti-bot -->
<div style="display:none;position:absolute;left:-9999px" aria-hidden="true">
    <input type="text"     name="fake-user" tabindex="-1" autocomplete="username">
    <input type="password" name="fake-pwd"  tabindex="-1" autocomplete="current-password">
</div>

<!-- Page de connexion -->
<!-- flex-direction:column géré par .login-card dans style.css — pas de style inline -->
<div class="login-card" id="login-page">
    <img src="/icon-192.png" alt="MyDaily" style="width:72px;border-radius:16px;margin-bottom:12px;">
    <h1>MyDaily</h1>
    <form id="login-form" autocomplete="off" style="width:100%">
        <input type="text"     id="username" placeholder="Nom d'utilisateur" required>
        <input type="password" id="password" placeholder="Mot de passe"       required>
        <button type="submit" class="btn">Se connecter</button>
    </form>
    <div id="error-msg"></div>
</div>

<!-- Application principale -->
<div id="app">
    <div class="topbar">
        <div class="topbar-left">
            <h2 onclick="actualiser()" title="Actualiser">MyDaily</h2>
            <span class="date-badge" id="date-display"></span>
        </div>
        <div class="topbar-right">
            <button class="icon-btn" id="btn-profil-header" onclick="openModal('profil')" title="Mon Profil">👤</button>
            <button class="icon-btn" onclick="logout()" title="Se déconnecter">🔓</button>
        </div>
    </div>
    <div class="grid" id="main-grid"></div>
    <div class="footer"></div>
</div>

<!-- Modale générique -->
<div class="overlay" id="overlay" onclick="closeOutside(event)">
    <div class="modal">
        <button class="mclos" onclick="closeModal()">&#10005;</button>
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
    </div>
</div>

<!-- Scripts — ordre important : app.js en premier, widgets.js en dernier -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js" defer></script>
<script src="/js/app.js"          defer></script>
<script src="/js/modal.js"        defer></script>
<script src="/js/profil.js"       defer></script>
<script src="/js/widgets.js"      defer></script>
<script src="/js/meteo.js"        defer></script>
<script src="/js/priere.js"       defer></script>
<script src="/js/islam.js"        defer></script>
<script src="/js/taches.js"       defer></script>
<script src="/js/anniversaires.js" defer></script>
<script src="/js/admin.js"        defer></script>
<script src="/js/cycle.js"        defer></script>
<script src="/js/rendezvous.js"   defer></script>
<script src="/js/planning.js"     defer></script>
<script src="/js/push.js"         defer></script>
</body>
</html>
