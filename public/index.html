<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDaily</title>
    <link rel="icon" href="/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MyDaily">
    <meta name="theme-color" content="#7C3AED">
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/feed.css">
</head>
<body>

<!-- Honeypot anti-bot -->
<div style="display:none;position:absolute;left:-9999px" aria-hidden="true">
    <input type="text"     name="fake-user" tabindex="-1" autocomplete="username">
    <input type="password" name="fake-pwd"  tabindex="-1" autocomplete="current-password">
</div>

<!-- Page de connexion -->
<div class="login-card" id="login-page">
    <img src="/icon-192.png" alt="MyDaily" style="width:72px;border-radius:16px;margin-bottom:12px;">
    <h1>MyDaily</h1>
    <form id="login-form" autocomplete="off" style="width:100%">
        <input type="text"     id="username" placeholder="Nom d'utilisateur" required>
        <div class="pwd-wrapper">
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="button" class="pwd-toggle" id="toggle-password" aria-label="Afficher le mot de passe">👁</button>
        </div>
        <button type="submit" class="btn">Se connecter</button>
    </form>
    <div id="error-msg"></div>
</div>

<!-- Application principale -->
<div id="app">

    <!-- Topbar -->
    <div class="topbar">
        <div class="topbar-left">
            <h2 id="topbar-title">MyDaily</h2>
            <span class="date-badge" id="date-display"></span>
        </div>
        <div class="topbar-right">
            <button class="icon-btn" id="btn-profil-header" onclick="switchTab('moi')" title="Mon Profil">👤</button>
            <button class="icon-btn" onclick="logout()" title="Se déconnecter">🔓</button>
        </div>
    </div>

    <!-- Contenu onglets -->
    <div class="tab-content-wrap">

        <!-- ONGLET 1 — Accueil -->
        <div class="tab-pane" id="tab-accueil">
            <!-- Météo figée -->
            <div class="accueil-meteo-fixed" id="accueil-meteo"></div>
            <!-- Feed social -->
            <div class="accueil-feed" id="accueil-feed">
                <div class="feed-placeholder">
                    <span>Le fil social arrive bientôt ✨</span>
                </div>
            </div>
        </div>

        <!-- ONGLET 2 — Mon Quotidien -->
        <div class="tab-pane" id="tab-quotidien">
            <div class="grid" id="grid-quotidien"></div>
        </div>

        <!-- ONGLET 3 — Bien-être -->
        <div class="tab-pane" id="tab-bienetre">
            <div class="grid" id="grid-bienetre"></div>
        </div>

        <!-- ONGLET 4 — Liens -->
        <div class="tab-pane" id="tab-liens">
            <div class="grid" id="grid-liens"></div>
        </div>

        <!-- ONGLET 5 — App -->
        <div class="tab-pane" id="tab-app">
            <div class="grid" id="grid-app"></div>
        </div>

    </div>

    <!-- Bottom nav (mobile) -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="bn-item active" data-tab="accueil"   onclick="switchTab('accueil')">
            <span class="bn-icon">🏠</span>
            <span class="bn-label">Accueil</span>
        </button>
        <button class="bn-item" data-tab="quotidien" onclick="switchTab('quotidien')">
            <span class="bn-icon">📅</span>
            <span class="bn-label">Quotidien</span>
        </button>
        <button class="bn-item" data-tab="bienetre"  onclick="switchTab('bienetre')">
            <span class="bn-icon">🌸</span>
            <span class="bn-label">Bien-être</span>
        </button>
        <button class="bn-item" data-tab="liens"     onclick="switchTab('liens')">
            <span class="bn-icon">🔗</span>
            <span class="bn-label">Liens</span>
        </button>
        <button class="bn-item" data-tab="app"       onclick="switchTab('app')">
            <span class="bn-icon">⚙️</span>
            <span class="bn-label">App</span>
        </button>
    </nav>

    <div class="footer"></div>
</div>

<!-- Modale générique -->
<div class="overlay" id="overlay" onclick="closeOutside(event)">
    <div class="modal">
        <button class="mclos" onclick="closeModal()">&#10005;</button>
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js" defer></script>
<script src="/js/app.js"           defer></script>
<script src="/js/modal.js"         defer></script>
<script src="/js/profil.js"        defer></script>
<script src="/js/widgets.js"       defer></script>
<script src="/js/meteo.js"         defer></script>
<script src="/js/priere.js"        defer></script>
<script src="/js/islam.js"         defer></script>
<script src="/js/taches.js"        defer></script>
<script src="/js/anniversaires.js" defer></script>
<script src="/js/admin.js"         defer></script>
<script src="/js/cycle.js"         defer></script>
<script src="/js/rendezvous.js"    defer></script>
<script src="/js/planning.js"      defer></script>
<script src="/js/push.js"          defer></script>
<script src="/js/astrologie.js"    defer></script>
<script src="/js/feed.js"          defer></script>
</body>
</html>
