<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyVibe - Mon Sanctuaire</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='55' x='50' text-anchor='middle' font-size='55'>🏡</text></svg>">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MyVibe">
    <meta name="theme-color" content="#4f46e5">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;justify-content:center;align-items:center}
        .login-card{background:#fff;padding:40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:380px;text-align:center}
        .login-card h1{color:#4f46e5;font-size:24px;margin-bottom:8px}
        .login-card p{color:#888;font-size:14px;margin-bottom:28px}
        input{width:100%;padding:14px;margin-bottom:16px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;transition:border-color .2s}
        input:focus{border-color:#4f46e5}
        .btn{width:100%;padding:14px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
        .btn:hover{background:#4338ca}
        #error-msg{color:#ef4444;margin-top:14px;font-size:14px;min-height:20px}
        #app{display:none;flex-direction:column;width:100vw;height:100vh;background:#f3f4f6}
        .topbar{background:#4f46e5;color:#fff;padding:0 24px;height:60px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
        .topbar-left{display:flex;align-items:center;gap:12px}
        .topbar-left h2{font-size:18px;font-weight:700;cursor:pointer;user-select:none}
        .topbar-left h2:hover{opacity:.85}
        .date-badge{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;font-size:13px}
        .topbar-right{display:flex;align-items:center;gap:10px}
        .icon-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s;overflow:hidden;padding:0}
        .icon-btn:hover{background:rgba(255,255,255,.35)}
        .icon-btn img{width:38px;height:38px;object-fit:cover;border-radius:50%}

        .grid{flex:1;overflow-y:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-content:start}
        .widget{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.07);cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s;position:relative;user-select:none}
        .widget:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
        .widget.dragging{opacity:.35;transform:scale(.96);box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:grabbing}
        .widget.drag-over{outline:3px dashed #4f46e5;outline-offset:3px;background:#f5f3ff;transform:translateY(-2px)}
        .drag-handle{position:absolute;top:12px;right:44px;color:#d1d5db;font-size:15px;cursor:grab;padding:4px 6px;border-radius:4px;line-height:1;opacity:0;transition:opacity .15s}
        .widget:hover .drag-handle{opacity:1}
        .drag-handle:hover{color:#6b7280;background:#f3f4f6}

        .wh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
        .whl{display:flex;align-items:center;gap:10px}
        .wi{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0}
        .wt{font-weight:700;font-size:15px;color:#333}
        .wc{color:#666;font-size:14px;line-height:1.5}
        .wf{margin-top:12px;font-size:12px;color:#9ca3af;text-align:right}
        .w-meteo .wi{background:#e0f2fe}
        .w-priere .wi{background:#fef3c7}
        .w-taches .wi{background:#d1fae5}
        .w-rdv .wi{background:#ede9fe}
        .w-planning .wi{background:#fee2e2}
        .w-anniversaires .wi{background:#fce7f3}
        .w-mails .wi{background:#e0e7ff}
        .w-profil .wi{background:#f3f4f6}
        .w-admin .wi{background:#fef3c7}
        .wi img{width:40px;height:40px;object-fit:cover;border-radius:10px}
        .rbtn{background:none;border:none;cursor:pointer;font-size:15px;padding:4px;border-radius:4px}
        .rbtn:hover{background:#f3f4f6}
        .footer{background:#f3f4f6;color:#e879a0;text-align:center;padding:10px;font-size:13px;font-weight:600;flex-shrink:0}

        .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center}
        .overlay.on{display:flex}
        .modal{background:#fff;border-radius:20px;padding:30px;width:90%;max-width:560px;max-height:88vh;overflow-y:auto;position:relative}
        .modal h3{font-size:20px;color:#333;margin-bottom:16px}
        .mclos{position:absolute;top:16px;right:16px;background:#f3f4f6;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
        .mclos:hover{background:#e5e7eb}
        .modal p{color:#666;font-size:15px;line-height:1.6}
        .priere-txt{color:#444;font-size:16px;line-height:1.8;font-style:italic}
        .priere-ref{color:#4f46e5;font-size:14px;font-weight:700;font-style:normal;margin-top:14px;display:block}
        .meteo-detail{font-size:15px;color:#333;line-height:2}
        .ville-form{display:flex;gap:8px;margin-top:16px}
        .ville-form input{flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px;margin:0}
        .ville-form button{padding:10px 16px;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;width:auto}
        .geo-btn{width:100%;margin-top:8px;padding:10px;background:#10b981;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
        .profil-form input,.profil-form textarea{width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit}
        .profil-form input:focus,.profil-form textarea:focus{border-color:#4f46e5}
        .profil-form textarea{resize:vertical}
        .save-btn{width:100%;padding:12px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
        .save-btn:hover{background:#4338ca}
        .danger-btn{width:100%;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
        .danger-btn:hover{background:#dc2626}
        .photo-circle{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #4f46e5;cursor:pointer;display:block;margin:0 auto 8px}
        .initiales{width:96px;height:96px;border-radius:50%;background:#4f46e5;color:#fff;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;cursor:pointer}
        .separateur{border:none;border-top:2px solid #f3f4f6;margin:20px 0}
        .mdp-form input{width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none}
        .mdp-form input:focus{border-color:#4f46e5}

        /* ADMIN STYLES */
        .admin-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid #f3f4f6;padding-bottom:0}
        .admin-tab{padding:10px 18px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-size:14px;font-weight:600;color:#9ca3af;transition:all .15s}
        .admin-tab.active{color:#4f46e5;border-bottom-color:#4f46e5}
        .admin-tab-content{display:none}
        .admin-tab-content.active{display:block}
        .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
        .stat-card{background:#f8fafc;border-radius:12px;padding:16px;text-align:center;border:1px solid #e5e7eb}
        .stat-card .val{font-size:28px;font-weight:700;color:#4f46e5}
        .stat-card .lbl{font-size:12px;color:#9ca3af;margin-top:4px}
        .user-card{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:10px}
        .user-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
        .user-card-name{font-weight:700;font-size:15px;color:#333}
        .user-card-role{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
        .role-admin{background:#fef3c7;color:#d97706}
        .role-user{background:#d1fae5;color:#059669}
        .user-card-meta{font-size:12px;color:#9ca3af;margin-bottom:10px}
        .user-card-actions{display:flex;gap:8px;flex-wrap:wrap}
        .user-card-actions input{flex:1;min-width:120px;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px;margin:0}
        .ua-btn{padding:8px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
        .ua-btn-blue{background:#4f46e5;color:#fff}
        .ua-btn-blue:hover{background:#4338ca}
        .ua-btn-red{background:#fee2e2;color:#ef4444}
        .ua-btn-red:hover{background:#ef4444;color:#fff}
        .ua-btn-green{background:#d1fae5;color:#059669}
        .ua-btn-green:hover{background:#059669;color:#fff}
        .create-form input,.create-form select{width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;background:#fff}
        .create-form input:focus,.create-form select:focus{border-color:#4f46e5}
        .activity-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
        .activity-row:last-child{border-bottom:none}
        .activity-row .u{font-weight:600;color:#333}
        .activity-row .d{color:#9ca3af}
        .badge-success{display:inline-block;background:#d1fae5;color:#059669;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin-top:4px}
        .badge-error{display:inline-block;background:#fee2e2;color:#ef4444;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin-top:4px}
    </style>
</head>
<body>

<div class="login-card" id="login-page">
    <h1>🏡 MyVibe</h1>
    <p>Mon Sanctuaire</p>
    <form id="login-form">
        <input type="text" id="username" placeholder="Nom d'utilisateur" required>
        <input type="password" id="password" placeholder="Mot de passe" required>
        <button type="submit" class="btn">Se connecter</button>
    </form>
    <div id="error-msg"></div>
</div>

<div id="app">
    <div class="topbar">
        <div class="topbar-left">
            <h2 onclick="actualiser()" title="Actualiser">MyVibe</h2>
            <span class="date-badge" id="date-display"></span>
        </div>
        <div class="topbar-right">
            <button class="icon-btn" id="btn-profil-header" onclick="openModal('profil')" title="Mon Profil">👤</button>
            <button class="icon-btn" onclick="logout()" title="Se déconnecter">🔓</button>
        </div>
    </div>

    <div class="grid" id="main-grid"></div>

    <div class="footer">❤️ Je t'aime - Ton mari ❤️</div>
</div>

<div class="overlay" id="overlay" onclick="closeOutside(event)">
    <div class="modal">
        <button class="mclos" onclick="closeModal()">✕</button>
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
    </div>
</div>

<script>
// ===================== STATE =====================
let meteoData = null;
let dernierIndex = -1;
let priere = null;
let profilCache = null;
let dragSrc = null;
let longPressTimer = null;
let dragActif = false;


const WIDGETS_DEF = [
    { id:'meteo',        label:'Météo du jour',   icon:'🌤️', cls:'w-meteo',        desc:'Chargement...', foot:'Cliquez pour les détails', refresh:true },
    { id:'priere',       label:'Prière du jour',  icon:'🙏',  cls:'w-priere',       desc:'Chargement...', foot:'Cliquez pour la version complète', refresh:true },
    { id:'taches',       label:'Tâches du jour',  icon:'✅',  cls:'w-taches',       desc:'Aucune tâche pour aujourd\'hui', foot:'Cliquez pour gérer' },
    { id:'rdv',          label:'Rendez-vous',      icon:'📅',  cls:'w-rdv',          desc:'Aucun rendez-vous aujourd\'hui', foot:'Cliquez pour gérer' },
    { id:'planning',     label:'Planning',         icon:'📋',  cls:'w-planning',     desc:'Pas de garde aujourd\'hui', foot:'Cliquez pour voir le planning' },
    { id:'anniversaires',label:'Anniversaires',    icon:'🎂',  cls:'w-anniversaires',desc:'Aucun anniversaire à venir', foot:'Cliquez pour gérer' },
    { id:'mails',        label:'Mails',            icon:'📧',  cls:'w-mails',        desc:'Bientôt disponible', foot:'Cliquez pour consulter' },
    { id:'profil',       label:'Mon Profil',       icon:'👤',  cls:'w-profil',       desc:'Cliquez pour modifier votre profil', foot:'Modifier' },
];

const codes = {
    0:'Ciel dégagé ☀️',1:'Principalement dégagé 🌤️',2:'Partiellement nuageux ⛅',
    3:'Couvert ☁️',45:'Brouillard 🌫️',48:'Brouillard givrant 🌫️',
    51:'Bruine légère 🌦️',61:'Pluie légère 🌧️',63:'Pluie modérée 🌧️',
    65:'Forte pluie 🌧️',71:'Neige légère 🌨️',80:'Averses 🌦️',
    95:'Orage ⛈️',99:'Orage avec grêle ⛈️'
};

// ===================== INIT =====================
window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('myvibe_user')) showApp();
});

document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    document.getElementById('error-msg').textContent = '';
    const r = await fetch('/api/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username, password})
    });
    const d = await r.json();
    if (d.success) {
        localStorage.setItem('myvibe_user', JSON.stringify({username, role:d.role, userId:d.userId}));
        showApp();
    } else {
        document.getElementById('error-msg').textContent = d.message;
    }
});

async function showApp() {
    document.getElementById('login-page').style.display = 'none';
    document.body.style.background = '#f3f4f6';
    document.body.style.alignItems = 'stretch';
    document.getElementById('app').style.display = 'flex';
    afficherDate();
    await buildGrid();
    chargerPriere();
    chargerMeteoAuto();
    chargerProfilHeader();
}

// ===================== GRID & DRAG DROP =====================
async function buildGrid() {
    const user = JSON.parse(localStorage.getItem('myvibe_user'));
    const grid = document.getElementById('main-grid');
    grid.innerHTML = '';

    let ordre = null;
    try {
        const r = await fetch(`/api/widget-order?userId=${user.userId}`);
        const d = await r.json();
        if (d.success && d.ordre) ordre = d.ordre;
    } catch(e) {}

    let defs = [...WIDGETS_DEF];
    if (user?.role === 'admin') {
        defs.push({ id:'admin', label:'Administration', icon:'⚙️', cls:'w-admin', desc:'Gérer les utilisateurs et les paramètres', foot:'Accès admin' });
    }

    if (ordre) {
        const sorted = [];
        ordre.forEach(id => { const w = defs.find(d => d.id === id); if(w) sorted.push(w); });
        defs.forEach(w => { if(!ordre.includes(w.id)) sorted.push(w); });
        defs = sorted;
    }

    defs.forEach(def => grid.appendChild(creerWidget(def)));
    updateWidgetDynamics();
}

function creerWidget(def) {
    const div = document.createElement('div');
    div.className = `widget ${def.cls}`;
    div.dataset.id = def.id;
    div.draggable = true;

    div.innerHTML = `
        <span class="drag-handle" title="Déplacer">⠿</span>
        <div class="wh">
            <div class="whl">
                <div class="wi" id="wi-${def.id}">${def.icon}</div>
                <div class="wt">${def.label}</div>
            </div>
            ${def.refresh ? `<button class="rbtn" id="rbtn-${def.id}" title="Actualiser">🔄</button>` : ''}
        </div>
        <div class="wc" id="wc-${def.id}">${def.desc}</div>
        <div class="wf">${def.foot}</div>
    `;

    // Click sur widget (pas sur handle ni rbtn)
    div.addEventListener('click', e => {
        if (e.target.classList.contains('drag-handle') || e.target.classList.contains('rbtn')) return;
        openModal(def.id);
    });

    // Refresh buttons
    if (def.id === 'meteo') {
        div.querySelector('#rbtn-meteo')?.addEventListener('click', e => { e.stopPropagation(); chargerMeteoAuto(); });
    }
    if (def.id === 'priere') {
        div.querySelector('#rbtn-priere')?.addEventListener('click', e => { e.stopPropagation(); chargerPriere(); });
    }

    // Drag events
    div.addEventListener('dragstart', onDragStart);
    div.addEventListener('dragover',  onDragOver);
    div.addEventListener('dragleave', onDragLeave);
    div.addEventListener('drop',      onDrop);
    div.addEventListener('dragend',   onDragEnd);

    // Touch drag (mobile)
    ajouterTouchDrag(div);

    return div;
}

function onDragStart(e) {
    dragSrc = this;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', this.dataset.id);
}
function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (this !== dragSrc) this.classList.add('drag-over');
}
function onDragLeave() { this.classList.remove('drag-over'); }
function onDrop(e) {
    e.preventDefault();
    this.classList.remove('drag-over');
    if (this === dragSrc) return;
    const grid = document.getElementById('main-grid');
    const widgets = [...grid.children];
    const srcIdx = widgets.indexOf(dragSrc);
    const tgtIdx = widgets.indexOf(this);
    if (srcIdx < tgtIdx) grid.insertBefore(dragSrc, this.nextSibling);
    else grid.insertBefore(dragSrc, this);
    sauvegarderOrdre();
}
function onDragEnd() {
    this.classList.remove('dragging');
    document.querySelectorAll('.widget').forEach(w => w.classList.remove('drag-over'));
}

function ajouterTouchDrag(el) {
    let startX, startY, clone, origRect;

    el.addEventListener('touchstart', e => {
        dragActif = false;
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;

        longPressTimer = setTimeout(() => {
            dragActif = true;
            origRect = el.getBoundingClientRect();
            clone = el.cloneNode(true);
            clone.style.cssText = `
                position:fixed;z-index:9999;opacity:.75;pointer-events:none;
                width:${origRect.width}px;left:${origRect.left}px;top:${origRect.top}px;
                margin:0;transition:none;border-radius:16px;
                box-shadow:0 12px 32px rgba(0,0,0,.2);
            `;
            document.body.appendChild(clone);
            el.classList.add('dragging');
            dragSrc = el;
            if (navigator.vibrate) navigator.vibrate(40);
        }, 500);
    }, {passive:true});

    el.addEventListener('touchmove', e => {
        const t = e.touches[0];
        const dx = Math.abs(t.clientX - startX);
        const dy = Math.abs(t.clientY - startY);

        if (!dragActif && (dx > 8 || dy > 8)) {
            clearTimeout(longPressTimer);
            return;
        }

        if (!dragActif) return;

        e.preventDefault();

        const moveX = t.clientX - startX;
        const moveY = t.clientY - startY;
        clone.style.left = (origRect.left + moveX) + 'px';
        clone.style.top  = (origRect.top  + moveY) + 'px';

        clone.style.display = 'none';
        const below = document.elementFromPoint(t.clientX, t.clientY);
        clone.style.display = '';
        const target = below?.closest('.widget');
        document.querySelectorAll('.widget').forEach(w => w.classList.remove('drag-over'));
        if (target && target !== el) target.classList.add('drag-over');
    }, {passive:false});

    el.addEventListener('touchend', e => {
        clearTimeout(longPressTimer);
        if (!dragActif) return;

        const t = e.changedTouches[0];
        if (clone) clone.remove();
        el.classList.remove('dragging');
        dragActif = false;

        const below = document.elementFromPoint(t.clientX, t.clientY);
        const target = below?.closest('.widget');
        document.querySelectorAll('.widget').forEach(w => w.classList.remove('drag-over'));

        if (target && target !== el) {
            const grid = document.getElementById('main-grid');
            const widgets = [...grid.children];
            const srcIdx = widgets.indexOf(el);
            const tgtIdx = widgets.indexOf(target);
            if (srcIdx < tgtIdx) grid.insertBefore(el, target.nextSibling);
            else grid.insertBefore(el, target);
            sauvegarderOrdre();
        }
    }, {passive:true});
	
    el.addEventListener('touchcancel', () => {
        clearTimeout(longPressTimer);
        if (clone) clone.remove();
        el.classList.remove('dragging');
        dragActif = false;
        document.querySelectorAll('.widget').forEach(w => w.classList.remove('drag-over'));
    }, {passive:true});
}


async function sauvegarderOrdre() {
    const user = JSON.parse(localStorage.getItem('myvibe_user'));
    const ordre = [...document.querySelectorAll('.widget')].map(w => w.dataset.id);
    try {
        await fetch('/api/widget-order', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ userId: user.userId, ordre })
        });
    } catch(e) {}
}

function updateWidgetDynamics() {
    chargerProfilHeader();
}

// ===================== APP LOGIC =====================
function actualiser() {
    afficherDate();
    chargerPriere();
    chargerMeteoAuto();
    chargerProfilHeader();
}

function logout() {
    localStorage.removeItem('myvibe_user');
    window.location.reload();
}

async function chargerPriere() {

async function chargerMeteo(lat, lon, nomVille) {
    const el = document.getElementById('wc-meteo');
    if (el) el.textContent = 'Chargement...';
    try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis&forecast_days=1`;
        const r = await fetch(url);
        const d = await r.json();
        const temp = Math.round(d.current.temperature_2m);
        const desc = codes[d.current.weather_code]||'Variable';
        const vent = Math.round(d.current.wind_speed_10m);
        const hum = d.current.relative_humidity_2m;
        const max = Math.round(d.daily.temperature_2m_max[0]);
        const min = Math.round(d.daily.temperature_2m_min[0]);
        meteoData = {temp,desc,vent,hum,max,min,ville:nomVille,lat,lon};
        if (el) el.textContent = `${nomVille} — ${desc} — ${temp}°C`;
        localStorage.setItem('myvibe_ville', JSON.stringify({lat,lon,ville:nomVille}));
    } catch { if (el) el.textContent = 'Météo non disponible'; }
}

function chargerMeteoAuto() {
    const saved = localStorage.getItem('myvibe_ville');
    if (saved) { const v = JSON.parse(saved); chargerMeteo(v.lat,v.lon,v.ville); return; }
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            pos => chargerMeteo(pos.coords.latitude,pos.coords.longitude,'Ma position'),
            () => chargerMeteo(48.8566,2.3522,'Paris')
        );
    } else { chargerMeteo(48.8566,2.3522,'Paris'); }
}

async function rechercherVille() {
    const ville = document.getElementById('ville-input').value.trim();
    if (!ville) return;
    try {
        const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(ville)}&count=1&language=fr`);
        const d = await r.json();
        if (d.results?.length > 0) {
            const res = d.results[0];
            await chargerMeteo(res.latitude, res.longitude, res.name);
            closeModal();
        } else { alert('Ville introuvable.'); }
    } catch { alert('Erreur de recherche.'); }
}

function geoLocaliser() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            pos => { chargerMeteo(pos.coords.latitude,pos.coords.longitude,'Ma position'); closeModal(); },
            () => alert('Géolocalisation refusée.')
        );
    }
}

// ===================== PHOTO =====================
function previewPhoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 300;
            let w = img.width, h = img.height;
            if (w > h) { if (w > MAX) { h = h*MAX/w; w = MAX; } }
            else { if (h > MAX) { w = w*MAX/h; h = MAX; } }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img,0,0,w,h);
            const dataUrl = canvas.toDataURL('image/jpeg',0.7);
            const preview = document.getElementById('profil-photo-preview');
            if (preview) {
                preview.src = dataUrl;
            } else {
                const zone = document.querySelector('.initiales');
                if (zone) {
                    const newImg = document.createElement('img');
                    newImg.id = 'profil-photo-preview';
                    newImg.src = dataUrl;
                    newImg.className = 'photo-circle';
                    newImg.onclick = () => document.getElementById('photo-input').click();
                    zone.replaceWith(newImg);
                }
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

// ===================== PROFIL =====================
async function sauvegarderProfil() {
    const user = JSON.parse(localStorage.getItem('myvibe_user'));
    const msg = document.getElementById('profil-msg');
    msg.textContent = 'Sauvegarde...'; msg.style.color = '#9ca3af';
    const photoEl = document.getElementById('profil-photo-preview');
    const photo = photoEl?.src?.startsWith('data:') ? photoEl.src : (profilCache?.photo||null);
    const body = {
        userId: user.userId,
        prenom: document.getElementById('p-prenom').value,
        nom: document.getElementById('p-nom').value,
        date_naissance: document.getElementById('p-naissance').value||null,
        email: document.getElementById('p-email').value,
        telephone: document.getElementById('p-tel').value,
        profession: document.getElementById('p-prof').value,
        note: document.getElementById('p-note').value,
        photo
    };
    try {
        const r = await fetch('/api/profil', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const d = await r.json();
        if (d.success) {
            msg.textContent = '✅ Profil sauvegardé !'; msg.style.color = '#10b981';
            profilCache = {...profilCache,...body};
            chargerProfilHeader();
        } else { msg.textContent = '❌ '+d.message; msg.style.color='#ef4444'; }
    } catch { msg.textContent='❌ Erreur réseau'; msg.style.color='#ef4444'; }
}

async function changerMdp() {
    const user = JSON.parse(localStorage.getItem('myvibe_user'));
    const ancien  = document.getElementById('mdp-ancien').value;
    const nouveau = document.getElementById('mdp-nouveau').value;
    const confirm = document.getElementById('mdp-confirm').value;
    const msg = document.getElementById('mdp-msg');
    if (nouveau !== confirm) { msg.textContent='❌ Les mots de passe ne correspondent pas'; msg.style.color='#ef4444'; return; }
    msg.textContent='Sauvegarde...'; msg.style.color='#9ca3af';
    try {
        const r = await fetch('/api/changer-mdp', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:user.userId,ancienMdp:ancien,nouveauMdp:nouveau})});
        const d = await r.json();
        if (d.success) {
            msg.textContent='✅ Mot de passe changé !'; msg.style.color='#10b981';
            document.getElementById('mdp-ancien').value='';
            document.getElementById('mdp-nouveau').value='';
            document.getElementById('mdp-confirm').value='';
        } else { msg.textContent='❌ '+d.message; msg.style.color='#ef4444'; }
    } catch { msg.textContent='❌ Erreur réseau'; msg.style.color='#ef4444'; }
}

async function chargerAdminUsers() {
    const user = JSON.parse(localStorage.getItem('myvibe_user'));
    const r = await fetch(`/api/admin/users?adminId=${user.userId}`);
    const d = await r.json();
    if (!d.success) return;
    document.getElementById('admin-tab-users').innerHTML = d.users.map(u => `
        <div class="user-card" id="ucard-${u.id}">
            <div class="user-card-header">
                <div>
                    <span class="user-card-name">${u.username}</span>

async function resetMdpUser(userId, btn) {
    const user = JSON.parse(localStorage.getItem('myvibe_user'));
    const input = document.getElementById('reset-mdp-'+userId);
    const nouveauMdp = input.value.trim();
    if (!nouveauMdp) { alert('Entrez un nouveau mot de passe'); return; }
    try {
        const r = await fetch('/api/admin/reset-mdp', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminId:user.userId,targetUserId:userId,nouveauMdp})});
        const d = await r.json();
        if (d.success) { input.value=''; btn.textContent='✅'; setTimeout(()=>btn.textContent='🔑 MDP',2000); }
        else { alert('Erreur : '+d.message); }
    } catch { alert('Erreur réseau'); }
}

async function toggleRole(userId, roleActuel, btn) {
    const user = JSON.parse(localStorage.getItem('myvibe_user'));
    const newRole = roleActuel === 'admin' ? 'user' : 'admin';
    if (!confirm(`Changer ce compte en "${newRole}" ?`)) return;
    try {
        const r = await fetch('/api/admin/update-user', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminId:user.userId,targetUserId:userId,role:newRole})});
        const d = await r.json();
        if (d.success) { chargerAdminUsers(); }
        else { alert('Erreur : '+d.message); }
    } catch { alert('Erreur réseau'); }
}

async function supprimerUser(userId, username) {
    const user = JSON.parse(localStorage.getItem('myvibe_user'));
    if (!confirm(`Supprimer définitivement "${username}" ? Cette action est irréversible.`)) return;
    try {
        const r = await fetch('/api/admin/delete-user', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminId:user.userId,targetUserId:userId})});
        const d = await r.json();
        if (d.success) { document.getElementById('ucard-'+userId)?.remove(); chargerAdminStats(); }
        else { alert('Erreur : '+d.message); }
    } catch { alert('Erreur réseau'); }
}

async function creerUser() {
    const user = JSON.parse(localStorage.getItem('myvibe_user'));
    const username = document.getElementById('new-username').value.trim();
    const password = document.getElementById('new-password').value.trim();
    const role     = document.getElementById('new-role').value;
    const msg      = document.getElementById('create-msg');
    if (!username || !password) { msg.textContent='Remplissez tous les champs'; msg.style.color='#ef4444'; return; }
    msg.textContent='Création...'; msg.style.color='#9ca3af';
    try {
        const r = await fetch('/api/admin/create-user', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminId:user.userId,username,password,role})});
        const d = await r.json();
        if (d.success) {
            msg.textContent='✅ Utilisateur créé !'; msg.style.color='#10b981';
            document.getElementById('new-username').value='';
            document.getElementById('new-password').value='';
            chargerAdminUsers();
            chargerAdminStats();
        } else { msg.textContent='❌ '+d.message; msg.style.color='#ef4444'; }
    } catch { msg.textContent='❌ Erreur réseau'; msg.style.color='#ef4444'; }
}

// ===================== MODALS =====================
async function openModal(type) {
    document.getElementById('overlay').classList.add('on');
    const titres = {
        meteo:'🌤️ Météo du jour', priere:'🙏 Prière du jour',
        taches:'✅ Tâches du jour', rdv:'📅 Rendez-vous',
        planning:'📋 Planning', anniversaires:'🎂 Anniversaires',
        mails:'📧 Mails', profil:'👤 Mon Profil', admin:'⚙️ Administration'
    };
    document.getElementById('modal-title').textContent = titres[type]||type;

    if (type === 'meteo') {
        const d = meteoData;
        document.getElementById('modal-body').innerHTML = d ? `
            <div class="meteo-detail">
                <strong>📍 ${d.ville}</strong><br>
                ${d.desc}<br>
                🌡️ Température : <strong>${d.temp}°C</strong> (min ${d.min}°C / max ${d.max}°C)<br>
                💨 Vent : ${d.vent} km/h<br>
                💧 Humidité : ${d.hum}%
            </div>
            <div class="ville-form">
                <input type="text" id="ville-input" placeholder="Rechercher une ville...">
                <button onclick="rechercherVille()">OK</button>
            </div>
            <button class="geo-btn" onclick="geoLocaliser()">📍 Utiliser ma position</button>
        ` : `
            <p>Météo non disponible.</p>
            <div class="ville-form">
                <input type="text" id="ville-input" placeholder="Rechercher une ville...">
                <button onclick="rechercherVille()">OK</button>
            </div>
            <button class="geo-btn" onclick="geoLocaliser()">📍 Utiliser ma position</button>
        `;

    } else if (type === 'priere') {
        document.getElementById('modal-body').innerHTML = priere ? `
            <p class="priere-txt">"${priere.texte}"</p>
            <span class="priere-ref">— ${priere.ref}</span>
        ` : '<p>Chargement...</p>';

    } else if (type === 'profil') {
        document.getElementById('modal-body').innerHTML = '<p style="color:#9ca3af">Chargement...</p>';
        const user = JSON.parse(localStorage.getItem('myvibe_user'));
        if (!user?.userId) { document.getElementById('modal-body').innerHTML = '<p>Erreur : utilisateur non identifié.</p>'; return; }
        try {
            const r = await fetch(`/api/profil?userId=${user.userId}`);
            const d = await r.json();
            const p = d.profil||{};
            profilCache = p;
            const photoSrc = p.photo||'';
            const initiales = ((p.prenom?.[0]||'')+(p.nom?.[0]||'')).toUpperCase()||'👤';
            document.getElementById('modal-body').innerHTML = `
                <div style="text-align:center;margin-bottom:16px">
                    ${photoSrc
                        ? `<img id="profil-photo-preview" src="${photoSrc}" class="photo-circle" onclick="document.getElementById('photo-input').click()">`
                        : `<div class="initiales" onclick="document.getElementById('photo-input').click()">${initiales}</div>`
                    }
                    <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="previewPhoto(event)">
                    <div style="font-size:12px;color:#9ca3af;margin-bottom:8px">Cliquez sur la photo pour changer</div>
                </div>
                <div class="profil-form">
                    <input id="p-prenom" placeholder="Prénom" value="${p.prenom||''}">
                    <input id="p-nom" placeholder="Nom" value="${p.nom||''}">
                    <input id="p-naissance" type="date" value="${p.date_naissance ? p.date_naissance.split('T')[0]:''}">
                    <input id="p-email" placeholder="Email" value="${p.email||''}">
                    <input id="p-tel" placeholder="Téléphone" value="${p.telephone||''}">
                    <input id="p-prof" placeholder="Profession" value="${p.profession||''}">
                    <textarea id="p-note" placeholder="Note personnelle..." rows="3">${p.note||''}</textarea>

        `;

    } else {
        document.getElementById('modal-body').innerHTML = '<p>En construction — disponible prochainement.</p>';
    }
}

function closeModal() { document.getElementById('overlay').classList.remove('on'); }
function closeOutside(e) { if (e.target===document.getElementById('overlay')) closeModal(); }
